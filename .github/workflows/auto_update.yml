name: 'Auto Update'
 
on:
  schedule:
  - cron: "23 0 * * *"
  workflow_dispatch:
 
jobs:
  sync:
    name: 'Auto Update'
    runs-on: ubuntu-latest
 
    defaults:
      run:
        shell: bash
 
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.MY_SECRETS_TOKEN }}

    - name: Update packages
      env:
        GH_TOKEN: ${{ secrets.MY_SECRETS_TOKEN }}
      run: |
        packages/net/uugamebooster/update.sh

        FAKEHTTP_RELEASE=$(gh api repos/MikeWang000000/FakeHTTP/releases/latest)
        FAKEHTTP_VERSION=$(jq -er '.tag_name' <<< "$FAKEHTTP_RELEASE")
        FAKEHTTP_HASH=$(jq -er '.assets[] | select(.name=="fakehttp-linux-x86_64.tar.gz") | .digest | select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' <<< "$FAKEHTTP_RELEASE")
        sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$FAKEHTTP_VERSION/" packages/net/fakehttp/Makefile
        sed -i "/(\$(ARCH),x86_64)/{n;s/PKG_HASH:=.*/PKG_HASH:=$FAKEHTTP_HASH/;}" packages/net/fakehttp/Makefile

        FAKESIP_RELEASE=$(gh api repos/MikeWang000000/FakeSIP/releases/latest)
        FAKESIP_VERSION=$(jq -er '.tag_name' <<< "$FAKESIP_RELEASE")
        FAKESIP_HASH=$(jq -er '.assets[] | select(.name=="fakesip-linux-x86_64.tar.gz") | .digest | select(test("^sha256:[0-9a-f]{64}$")) | ltrimstr("sha256:")' <<< "$FAKESIP_RELEASE")
        sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=$FAKESIP_VERSION/" packages/net/fakesip/Makefile
        sed -i "/(\$(ARCH),x86_64)/{n;s/PKG_HASH:=.*/PKG_HASH:=$FAKESIP_HASH/;}" packages/net/fakesip/Makefile

    - name: Commit update
      run: |
        set -euo pipefail

        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'

        updated=0
        for package in uugamebooster fakehttp fakesip; do
          makefile="packages/net/$package/Makefile"
          if ! git diff --quiet -- "$makefile"; then
            version="$(sed -n 's/^PKG_VERSION:=[[:space:]]*//p' "$makefile")"
            [ -n "$version" ] || { echo "Missing PKG_VERSION in $makefile" >&2; exit 1; }
            git add -- "$makefile"
            git commit -m "$package: update to $version"
            updated=1
          fi
        done

        [ "$updated" -eq 0 ] || git push

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        token: ${{ github.token }}
        retain_days: 1
        keep_minimum_runs: 3
