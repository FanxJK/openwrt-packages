name: "Build Package x86_64"

on:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/prepare_pages.py"
      - ".github/workflows/build_pakcage_x86_64.yml"
      - "luci/**"
      - "packages/**"
      - "keys/public-key.pem"
  workflow_dispatch:
    inputs:
      packages:
        description: Optional package list separated by spaces; empty builds all packages in this repo
        required: false
        type: string
        default: ""
      publish:
        description: Publish a complete signed build to GitHub Pages; packages must be empty
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai

permissions:
  contents: read

jobs:
  build:
    name: Build x86_64-25.12
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      publish: ${{ steps.publish_gate.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: publish_gate
        env:
          REQUESTED_PACKAGES: ${{ inputs.packages }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        run: |
          publish=false
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            publish=true
          elif [ "$PUBLISH_REQUESTED" = "true" ]; then
            if [ -n "$REQUESTED_PACKAGES" ]; then
              echo "::error::A partial package build must not replace the complete Pages repository. Clear the packages input before publishing."
              exit 1
            fi
            publish=true
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Check signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: test -n "$APK_SIGNING_KEY"

      - name: Build packages
        uses: openwrt/gh-action-sdk@main
        env:
          CONTAINER: immortalwrt/sdk
          ARCH: x86_64-openwrt-25.12
          FEEDNAME: packages_ci
          PACKAGES: ${{ inputs.packages }}
          BUILD_LOG: 1
          INDEX: 1
          PRIVATE_KEY: ${{ secrets.APK_SIGNING_KEY }}
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1

      - name: Verify signed repository index
        if: steps.publish_gate.outputs.publish == 'true'
        run: |
          feed_dir="${GITHUB_WORKSPACE}/bin/packages/x86_64/packages_ci"
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${feed_dir}:/repo:ro" \
            -v "${GITHUB_WORKSPACE}/keys/public-key.pem:/keys/public-key.pem:ro" \
            sdk \
            -ec 'staging_dir/host/bin/apk --keys-dir /keys verify /repo/packages.adb'

      - name: Add public key
        run: cp keys/public-key.pem bin/packages/x86_64/packages_ci/public-key.pem

      - name: Prepare Pages site
        if: steps.publish_gate.outputs.publish == 'true'
        run: |
          python3 .github/scripts/prepare_pages.py \
            --feed-dir "bin/packages/x86_64/packages_ci" \
            --output-dir "${RUNNER_TEMP}/pages-site"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-x86_64-25.12
          path: bin/packages/x86_64/packages_ci
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: steps.publish_gate.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site
          retention-days: 7

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: immortalwrt-x86_64-25.12-logs
          path: logs
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
